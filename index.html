<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ForGood</title>
<style>@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-stretch:75% 100%;src:url("BricolageGrotesque.ttf") format("truetype");font-display:swap;}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ForGood">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>window.ForGoodWeb = true;</script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEEF1;--card:#FFFFFF;--card2:#F5F6F8;--ink:#121417;--ink2:#3E434B;--muted:#6C737E;--line:rgba(18,20,23,.09);
  --jade:#00855A;--on-jade:#FFFFFF;--jade-soft:#DCF1E7;
  --sun:#EE9A00;--sun-soft:#FFF0CF;
  --coral:#DC4235;--coral-soft:#FBE2DF;
  --shade:rgba(10,12,16,.46);
  --bar:rgba(244,245,247,.86);
  --display:"Bricolage Grotesque",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#16181C;--card2:#202329;--ink:#F2F3F5;--ink2:#C9CDD3;--muted:#8D939C;--line:rgba(255,255,255,.1);
    --jade:#22C27F;--on-jade:#04150D;--jade-soft:#0E2B1F;
    --sun:#FFB72B;--sun-soft:#2F2511;
    --coral:#FF6A5D;--coral-soft:#341A19;
    --shade:rgba(0,0,0,.62);--bar:rgba(22,24,28,.86);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#16181C;--card2:#202329;--ink:#F2F3F5;--ink2:#C9CDD3;--muted:#8D939C;--line:rgba(255,255,255,.1);
  --jade:#22C27F;--on-jade:#04150D;--jade-soft:#0E2B1F;
  --sun:#FFB72B;--sun-soft:#2F2511;
  --coral:#FF6A5D;--coral-soft:#341A19;
  --shade:rgba(0,0,0,.62);--bar:rgba(22,24,28,.86);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--ui);-webkit-font-smoothing:antialiased;}
html.locked,html.locked body{overflow:hidden;}
button{font:inherit;color:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
a{color:var(--jade);text-underline-offset:2px;}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px;}
[hidden]{display:none!important;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- layout ---------- */
.app{max-width:560px;margin:0 auto;padding:10px 16px calc(96px + env(safe-area-inset-bottom,0px));}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 2px 16px;}
.top .date{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 2px;}
.top h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.025em;margin:0;}
.round-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:21px;border:0;background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);flex:none;}
.round-btn svg{width:20px;height:20px;}
.section-title{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:24px 4px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.section-title small{font-family:var(--ui);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;}
.card{background:var(--card);border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.pad{padding:18px;}
.muted{color:var(--muted);}
.fine{font-size:13.5px;color:var(--muted);margin:8px 0 0;line-height:1.45;}
.center{text-align:center;}

/* ---------- week summary ---------- */
.summary{padding:18px 18px 14px;}
.sum-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.big-count{font-family:var(--display);font-weight:800;font-size:44px;line-height:.95;letter-spacing:-.03em;}
.big-count span{color:var(--muted);font-weight:600;}
.sum-label{font-size:14px;color:var(--muted);font-weight:500;margin-top:4px;}
.weeknav{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--ink2);}
.weeknav button{width:32px;height:32px;border-radius:16px;border:0;background:var(--card2);display:grid;place-items:center;}
.weeknav button svg{width:16px;height:16px;}
.weeknav button:disabled{opacity:.35;cursor:default;}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border-radius:14px;}
.day.today{background:var(--card2);}
.bar{width:16px;height:46px;border-radius:9px;background:var(--line);overflow:hidden;display:flex;flex-direction:column-reverse;}
.bar i{display:block;width:100%;}
.bar .b-done{background:var(--jade);}
.bar .b-wait{background:var(--sun);}
.bar .b-miss{background:var(--coral);}
.day b{font-size:11.5px;font-weight:700;color:var(--muted);}
.day span{font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;}
.day.today b,.day.today span{color:var(--ink);}

/* ---------- list rows ---------- */
.list{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 14px 16px;border:0;background:none;text-align:left;position:relative;}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line);}
.row:active{background:var(--card2);}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:16.5px;line-height:1.25;overflow-wrap:anywhere;}
.row-sub{font-size:14px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:0 10px;align-items:center;}
.row-sub .due{color:var(--sun);font-weight:600;}
.row-sub .bad{color:var(--coral);font-weight:600;}
.row-sub .good{color:var(--jade);font-weight:600;}
.chev{width:16px;height:16px;color:var(--muted);flex:none;}
.st{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;flex:none;}
.st svg{width:18px;height:18px;}
.st-due{background:var(--sun-soft);color:var(--sun);}
.st-wait{background:var(--sun-soft);color:var(--sun);}
.st-done{background:var(--jade);color:var(--on-jade);}
.st-skip{background:var(--card2);color:var(--muted);}
.st-miss{background:var(--coral);color:#fff;}
.st-paid{background:var(--ink);color:var(--card);}
.st-up{background:var(--card2);color:var(--muted);}
.streak{display:inline-flex;align-items:center;gap:2px;color:var(--sun);font-weight:700;font-variant-numeric:tabular-nums;}
.streak svg{width:13px;height:13px;}
.coin{flex:none;min-width:46px;height:30px;padding:0 9px;border-radius:15px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;background:var(--card2);color:var(--ink);font-variant-numeric:tabular-nums;}
.coin.hot{background:var(--coral-soft);color:var(--coral);}
.empty{padding:26px 20px;text-align:center;}
.empty h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 6px;letter-spacing:-.01em;}
.empty p{margin:0 auto 16px;max-width:30em;color:var(--muted);}

/* ---------- banners ---------- */
.owed{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:var(--coral-soft);margin:12px 0 0;border:0;width:100%;text-align:left;color:var(--ink);}
.owed .st{background:var(--coral);color:#fff;}
.owed b{display:block;font-size:16px;}
.owed span{font-size:14px;color:var(--ink2);}
.note{padding:12px 14px;border-radius:16px;background:var(--card);font-size:14.5px;margin:0 0 12px;color:var(--ink2);}
.note b{color:var(--ink);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:15px;border:0;background:var(--card2);color:var(--ink);font-weight:600;font-size:16px;text-align:center;text-decoration:none;}
.btn svg{width:18px;height:18px;}
.btn.primary{background:var(--jade);color:var(--on-jade);}
.btn.dark{background:var(--ink);color:var(--card);}
.btn.danger{background:var(--coral);color:#fff;}
.btn.ghost{background:transparent;border:1.5px solid var(--line);}
.btn.small{min-height:38px;padding:0 14px;font-size:14.5px;border-radius:12px;}
.btn.wide{width:100%;}
.btn:disabled{opacity:.55;cursor:progress;}
.stack{display:grid;gap:10px;}
.pair{display:flex;gap:10px;}
.pair>.btn{flex:1;}
.link{background:none;border:0;padding:8px 2px;color:var(--jade);font-weight:600;font-size:15px;}
.link.danger{color:var(--coral);}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:17px;border:0;background:var(--card);font-weight:600;font-size:14px;color:var(--ink);}
.pill svg{width:16px;height:16px;}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);position:relative;}
.tab svg{width:24px;height:24px;}
.tab[aria-current="page"]{color:var(--ink);}
.tab .dot{position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;}
.plus{justify-self:center;width:56px;height:56px;border-radius:28px;border:0;background:var(--ink);color:var(--card);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18);margin-top:-18px;}
.plus svg{width:26px;height:26px;}

/* ---------- pushed pages ---------- */
.page{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slidein .26s cubic-bezier(.2,.8,.2,1);}
.page[hidden]{display:none;}
.page-in{max-width:560px;margin:0 auto;padding:6px 16px 48px;}
.navbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;background:var(--bg);}
.navbar .title{font-weight:600;font-size:16px;text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbar .side{width:76px;display:flex;}
.navbar .side.r{justify-content:flex-end;}
@keyframes slidein{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.page,.overlay,.sheet{animation:none!important;}#toast{transition:none;}}

/* ---------- detail ---------- */
.hero{padding:20px 18px 18px;}
.hero h2{font-family:var(--display);font-weight:800;font-size:31px;line-height:1.02;letter-spacing:-.02em;margin:0 0 8px;overflow-wrap:anywhere;}
.hero .meta{font-size:15px;color:var(--ink2);margin:0;}
.stake-line{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;}
.stake-line .coin{font-size:17px;height:34px;min-width:58px;}
.stake-line b{font-weight:600;}
.now{padding:18px;margin-top:12px;}
.now-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.now-head .st{width:42px;height:42px;border-radius:21px;}
.now-head .st svg{width:22px;height:22px;}
.now-title{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;letter-spacing:-.01em;}
.now-sub{font-size:14.5px;color:var(--muted);margin-top:2px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.stat{background:var(--card);border-radius:18px;padding:14px 12px;}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stat span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:500;}
.hist{display:flex;flex-wrap:wrap;gap:6px;padding:16px;}
.hd{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--card2);font-variant-numeric:tabular-nums;}
.hd.done{background:var(--jade);color:var(--on-jade);}
.hd.miss{background:var(--coral);color:#fff;}
.hd.paid{background:var(--ink);color:var(--card);}
.hd.skip{background:transparent;border:1.5px dashed var(--line);}
.hd.wait{background:var(--sun);color:#271A00;}
.proofs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.thumb{position:relative;border:0;padding:0;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--card2);cursor:zoom-in;}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb span{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:left;}
.code-box{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:18px;background:var(--card2);margin:10px 0;}
.code{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.12em;line-height:1;-webkit-user-select:all;user-select:all;}

/* ---------- duel board ---------- */
.vs{padding:18px;}
.player{display:flex;align-items:center;gap:12px;padding:12px 0;}
.player+.player{border-top:1px solid var(--line);}
.avatar{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--card2);color:var(--ink);flex:none;}
.avatar.out{opacity:.45;text-decoration:line-through;}
.player .name{font-weight:600;flex:1;min-width:0;}
.player .name small{display:block;font-weight:500;font-size:13.5px;color:var(--muted);}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;}
.tag.done{background:var(--jade-soft);color:var(--jade);}
.tag.wait{background:var(--sun-soft);color:var(--sun);}
.tag.out{background:var(--coral-soft);color:var(--coral);}
.tag.win{background:var(--ink);color:var(--card);}
.result{padding:18px;margin-top:12px;}
.result.lose{background:var(--coral-soft);}
.result.win{background:var(--jade-soft);}
.result h3{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.05;margin:0 0 6px;letter-spacing:-.015em;}
.result p{margin:0 0 12px;color:var(--ink2);}

/* ---------- impact ---------- */
.impact{padding:22px 20px;}
.impact .k{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.035em;}
.impact .l{font-size:15px;color:var(--muted);margin-top:8px;}

/* ---------- forms ---------- */
.field{display:block;margin:0 0 18px;border:0;padding:0;min-width:0;}
.lab{display:block;font-weight:600;font-size:15px;margin:0 0 8px;padding:0;color:var(--ink);}
.hint{display:block;font-size:13.5px;color:var(--muted);margin-top:6px;}
.input,.field textarea,.field select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:50px;-webkit-appearance:none;appearance:none;}
.sheet .input,.sheet textarea{background:var(--card2);}
.field textarea{min-height:88px;resize:vertical;}
.input:focus,.field textarea:focus{outline:none;border-color:var(--jade);}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:15px;background:var(--card2);}
.seg button{min-height:40px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:14.5px;color:var(--ink2);}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:42px;padding:0 16px;border-radius:21px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;color:var(--ink);}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);}
.chip.money{font-family:var(--display);font-weight:700;font-size:18px;min-width:62px;}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.days .chip{padding:0;min-width:0;}
.sentence{font-size:17px;line-height:2.4;font-weight:500;color:var(--ink2);}
.opt-list{display:grid;gap:8px;}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%;}
.opt[aria-pressed="true"],.opt:has(input:checked){border-color:var(--jade);background:var(--jade-soft);}
.opt input{width:20px;height:20px;accent-color:var(--jade);flex:none;margin:0;}
.opt b{display:block;font-weight:600;font-size:15.5px;}
.opt small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px;}
.opt .st{width:40px;height:40px;border-radius:12px;}
.method-ic{background:var(--card2);color:var(--ink);}
.inline{display:flex;align-items:center;gap:10px;}
.inline .input{flex:1;}
.dollar{position:relative;max-width:170px;}
.dollar::before{content:"$";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none;}
.dollar .input{padding-left:28px;}
.stepper{display:inline-flex;align-items:center;border-radius:14px;background:var(--card2);overflow:hidden;}
.stepper button{width:48px;height:46px;border:0;background:transparent;font-size:22px;color:var(--ink);}
.stepper output{min-width:48px;text-align:center;font-family:var(--display);font-weight:800;font-size:22px;}
.rules{background:var(--card2);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--ink2);margin:0 0 14px;}
.rules ul{margin:6px 0 0;padding-left:18px;}
.rules li{margin:0 0 4px;}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:15px;margin:0 0 14px;cursor:pointer;}
.check input{width:22px;height:22px;accent-color:var(--jade);margin:0;flex:none;}
.err{color:var(--coral);font-weight:600;font-size:14.5px;margin:0 0 12px;}
.err:empty{display:none;}
.picker{display:block;position:relative;}
.picker input{position:absolute;width:1px;height:1px;opacity:0;}
.picker-face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border:2px dashed var(--line);border-radius:18px;background:var(--card2);font-weight:600;color:var(--jade);text-align:center;padding:12px;cursor:pointer;}
.picker-face svg{width:28px;height:28px;}
.picker input:focus-visible+.picker-face{outline:3px solid var(--jade);outline-offset:2px;}
.picker.has .picker-face{min-height:52px;flex-direction:row;}
.preview{border-radius:16px;overflow:hidden;margin:12px 0 0;}
.preview img{max-height:300px;margin:0 auto;}

/* ---------- sheets ---------- */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(24px + env(safe-area-inset-top,0px));animation:fade .18s ease-out;}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .24s cubic-bezier(.2,.8,.2,1);outline:none;}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px;}
@media (min-width:700px){.overlay{align-items:center;padding:24px;}.sheet{border-radius:26px;max-height:88%;}}
@keyframes rise{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;}
.sheet-head h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em;margin:0;}
.x{display:grid;place-items:center;width:36px;height:36px;border-radius:18px;border:0;background:var(--card2);color:var(--ink);flex:none;}
.x svg{width:16px;height:16px;}
.sheet p{margin:0 0 14px;}
.menu{display:grid;gap:8px;}
.verdict{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;margin:4px 0 14px;}
.verdict.ok{background:var(--jade-soft);}
.verdict.no{background:var(--coral-soft);}
.verdict.wait{background:var(--sun-soft);}
.verdict b{display:block;font-size:16px;}
.verdict span{font-size:14.5px;color:var(--ink2);}
.spin{width:22px;height:22px;border-radius:11px;border:3px solid var(--line);border-top-color:var(--jade);animation:spin 1s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- timer ---------- */
.timer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:var(--ink);color:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;}
.timer .clock{font-family:var(--display);font-weight:800;font-size:88px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.timer p{max-width:22em;opacity:.8;margin:0;}
.timer .btn{background:rgba(255,255,255,.12);color:inherit;}
.ring{width:220px;height:220px;}

/* ---------- misc ---------- */
.lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));}
.lb img{max-width:100%;max-height:100%;border-radius:10px;}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:rgba(255,255,255,.15);color:#fff;}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--card);padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90;text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}
html.has-sheet #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px));}
.splash{min-height:70vh;display:grid;place-items:center;}
.splash h1{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;}
.welcome h2{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.03em;margin:8px 0 10px;}
.welcome ol{padding-left:20px;margin:0 0 18px;color:var(--ink2);}
.welcome li{margin:0 0 8px;}
.mono-small{font-size:12px;word-break:break-all;color:var(--muted);}

.steps{margin:4px 0 14px;padding-left:22px;color:var(--ink2);}
.steps li{margin:0 0 8px;padding-left:2px;}
.thumb.sm{width:46px;height:46px;flex:none;border-radius:12px;aspect-ratio:auto;}
.thumb.wide{display:block;width:100%;aspect-ratio:4/3;max-height:380px;border-radius:16px;}
.thumb.wide img{object-fit:contain;background:var(--card2);}
.row .avatar{width:34px;height:34px;font-size:15px;}
.opt:disabled{cursor:default;}
.tabbar[hidden]{display:none;}
.splash{display:grid;place-items:center;min-height:80vh;}

</style>
</head>

<script>
(() => {
  'use strict';

    share: '<path d="M12 3.5v11M8 7.5l4-4 4 4M5 13v5a2 2 0 002 2h10a2 2 0 002-2v-5"/>',
    copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/><path d="M15.5 8.5V6A2 2 0 0013.5 4H6A2 2 0 004 6v7.5a2 2 0 002 2h2.5"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    ticket: '<path d="M4 7.5A1.5 1.5 0 015.5 6h13A1.5 1.5 0 0120 7.5V10a2 2 0 000 4v2.5a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 16.5V14a2 2 0 000-4z"/><path d="M10 9h4M10 15h4"/>',

  const FLAME = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.2 21.5c-3.7 0-6.4-2.6-6.4-6.2 0-3.3 2.3-5 3.5-7.7.4 1.7 1.3 2.8 2.4 3.3.2-3.1 1.5-6 3.7-8.1-.2 3.8 3.2 5.6 3.2 10.6 0 4.9-2.6 8.1-6.4 8.1z"/></svg>';
  const MICON = { photo: 'photo', camera: 'camera', timer: 'timer', gps: 'pin', friend: 'friend', self: 'self' };
  const ic = (n, cls) => '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[n] || '') + '</svg>';

  const S = {
    phase: 'boot', mode: 'local', shared: false, native: null, sync: false, web: false, store: null, user: null, sample: null, aiOff: false,
    meId: null, profileName: '', canWrite: null, readOnly: false, revoked: false, offline: false,
    settings: {}, tab: 'today', weekOffset: 0, pages: [], sheet: null, timer: null,
    forfeits: [], verifying: [], myCheckins: [], toVerify: [], mySettlements: [], duels: [], members: {}, membersLoaded: false,
    duelCheckins: {}, duelSettlements: {}, duelSubs: {}, names: {}, imgs: {},
    unsubs: [], ver: 0,
  };

  // ================= helpers =================
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const str = (v, max) => (typeof v === 'string' ? v : v == null ? '' : String(v)).slice(0, max || 300);
  const num = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : '');
  const safeImg = (u) => (typeof u === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(u) ? u : '');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const ls = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };
  function rand(n, abc) {
    const buf = new Uint32Array(n);
    try { crypto.getRandomValues(buf); } catch (e) { for (let i = 0; i < n; i++) buf[i] = Math.floor(Math.random() * 4294967295); }
    let out = '';
    for (let i = 0; i < n; i++) out += abc[buf[i] % abc.length];
    return out;
  }
  const rid = (n) => rand(n || 20, 'abcdefghijkmnpqrstuvwxyz23456789');
  const newCode = () => rand(6, 'ABCDEFGHJKMNPQRSTUVWXYZ23456789');
  const money = (n) => '$' + Number(n || 0).toLocaleString('en-US');
  const pad2 = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const isKey = (k) => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k);
  const isTime = (t) => typeof t === 'string' && /^\d{2}:\d{2}$/.test(t);
  const parseKey = (k) => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const dowOf = (k) => parseKey(k).getDay();
  const mondayOf = (k) => addDays(k, -((dowOf(k) + 6) % 7));
  const maxKey = (a, b) => (a > b ? a : b);
  const now = () => Date.now();
  const todayKey = () => keyOf(new Date(now()));
  function deadlineOf(k, t) {
    const d = parseKey(k);
    const hm = (isTime(t) ? t : '23:59').split(':').map(Number);
    d.setHours(hm[0], hm[1], 0, 0);
    return d.getTime();
  }
  const fmtTime = (t) => { const hm = (isTime(t) ? t : '23:59').split(':').map(Number); return new Date(2000, 0, 1, hm[0], hm[1]).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
  function fmtDay(k) {
    const t = todayKey();
    if (k === t) return 'Today';
    if (k === addDays(t, 1)) return 'Tomorrow';
    if (k === addDays(t, -1)) return 'Yesterday';
    return parseKey(k).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function rel(k) { const d = fmtDay(k); return d === 'Today' || d === 'Tomorrow' || d === 'Yesterday' ? d.toLowerCase() : 'on ' + d; }
  function relShort(k) { const d = fmtDay(k); return d === 'Today' || d === 'Tomorrow' || d === 'Yesterday' ? d.toLowerCase() : DOW_SHORT[dowOf(k)]; }
  function byWhen(k, t) { const d = fmtDay(k); return fmtTime(t) + (d === 'Today' ? ' today' : d === 'Tomorrow' ? ' tomorrow' : ' on ' + d); }
  const fmtWhen = (ms) => new Date(ms).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  function left(ms) {
    if (ms <= 0) return '0m';
    const m = Math.ceil(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;

    if (h) return h + 'h ' + mm + 'm';
    return mm + 'm';
  }
  const plural = (n, w, ws) => n + ' ' + (n === 1 ? w : (ws || w + 's'));
  const possessive = (n) => (/s$/i.test(n) ? n + '\u2019' : n + '\u2019s');
  const initial = (n) => (String(n || '?').trim().charAt(0) || '?').toUpperCase();
  const firstWord = (n) => String(n || '').trim().split(/\s+/)[0] || '';
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
  function deepMerge(t, s) {
    Object.keys(s).forEach((k) => {
      if (isObj(s[k]) && isObj(t[k])) deepMerge(t[k], s[k]);
      else t[k] = isObj(s[k]) || Array.isArray(s[k]) ? clone(s[k]) : s[k];
    });
    return t;
  }
  const b64u = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64u = (s) => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4))));

  // ================= native bridge =================
  function nativePost(msg) {
    try { window.webkit.messageHandlers.forgood.postMessage(msg); return true; } catch (e) { return false; }
  }
  function haptic(kind) { if (S.native) nativePost({ type: 'haptic', kind: kind || 'success' }); }

  // ================= stores =================
  async function retry(fn) {
    try { return await fn(); } catch (e) {
      if (e && e.code === 'unavailable') { await sleep(300 + Math.random() * 700); return fn(); }
      throw e;
    }
  }
  function makeClaudeStore(db) {
    const col = (c) => db.collection(c);
    const rows = (snap) => snap.docs.map((d) => Object.assign(clone(d.data() || {}), { id: d.id }));
    return {
      kind: 'claude',
      sub(c, field, op, value, cb, onErr) {
        const q = field ? col(c).where(field, op || '==', value) : col(c);
        return q.onSnapshot((snap) => cb(rows(snap)), (e) => { if (onErr) onErr(e); });
      },
      async getWhere(c, field, value) { return rows(await retry(() => col(c).where(field, '==', value).get())); },
      async get(c, id) { const s = await retry(() => col(c).doc(id).get()); return s.exists ? Object.assign(clone(s.data() || {}), { id: s.id }) : null; },
      newId(c) { return col(c).doc().id; },
      set(c, id, data) { return retry(() => col(c).doc(id).set(data)); },
      update(c, id, data) { return retry(() => col(c).doc(id).update(data)); },
      del(c, id) { return retry(() => col(c).doc(id).delete()); },
      async claim(c, id, holder) {
        try { const r = await retry(() => col(c).doc(id).acquire({ holder, ttlMs: 8000 })); return !!(r && r.acquired); } catch (e) {
          if (e && (e.code === 'capability_removed' || e.code === 'capability_disabled')) return true;
          throw e;
        }
      },
    };
  }
  function makeLocalStore() {
    const n = S.native;
    const data = {};
    COLLS.forEach((c) => {
      let raw = null;
      if (n) raw = n.saved && typeof n.saved[c] === 'string' ? n.saved[c] : null;
      else raw = ls.get(LOCAL_PREFIX + c);
      let v = null;
      try { v = JSON.parse(raw || 'null'); } catch (e) { v = null; }
      data[c] = isObj(v) ? v : {};
    });
    const subs = new Set(), timers = {}, pending = new Set();
    let warned = false;
    function flushOne(c) {
      clearTimeout(timers[c]); pending.delete(c);
      const json = JSON.stringify(data[c]);
      if (n) nativePost({ type: 'save', key: c, value: json });
      else if (!ls.set(LOCAL_PREFIX + c, json) && !warned) { warned = true; toast('This browser is out of storage. Older photos may not be kept.'); }
    }
    const persist = (c) => { pending.add(c); clearTimeout(timers[c]); timers[c] = setTimeout(() => flushOne(c), 250); };
    const flush = () => Array.from(pending).forEach(flushOne);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
    window.addEventListener('pagehide', flush);
    const match = (d, f, op, v) => !f || (op === 'array-contains' ? Array.isArray(d[f]) && d[f].indexOf(v) >= 0 : d[f] === v);
    const pick = (c, f, op, v) => Object.keys(data[c]).filter((id) => match(data[c][id], f, op, v)).map((id) => Object.assign(clone(data[c][id]), { id }));
    const fire = () => subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
    return {
      kind: 'local',
      sub(c, f, op, v, cb) { const fn = () => cb(pick(c, f, op, v)); subs.add(fn); setTimeout(() => { if (subs.has(fn)) fn(); }, 0); return () => subs.delete(fn); },
      async getWhere(c, f, v) { return pick(c, f, '==', v); },
      async get(c, id) { const d = data[c][id]; return d ? Object.assign(clone(d), { id }) : null; },
      newId() { return rid(20); },
      async set(c, id, d) { data[c][id] = clone(d); persist(c); fire(); },
      async update(c, id, d) {
        if (!data[c][id]) { const e = new Error('missing'); e.code = 'invalid_argument'; throw e; }
        deepMerge(data[c][id], d); persist(c); fire();
      },

  const ORDER = { due: 0, pending: 1, failed: 2, upcoming: 3, done: 5, skipped: 6, settled: 7 };
  const STI = { due: ['st-due', 'clock'], pending: ['st-wait', 'wait'], done: ['st-done', 'check'], skipped: ['st-skip', 'skip'], failed: ['st-miss', 'x'], settled: ['st-paid', 'heart'], upcoming: ['st-up', 'clock'] };
  const stIcon = (s) => { const m = STI[s] || STI.upcoming; return '<span class="st ' + m[0] + '">' + ic(m[1]) + '</span>'; };
  const streakHTML = (n) => (n ? '<span class="streak" aria-label="' + n + ' in a row">' + FLAME + n + '</span>' : '');
  const noteHTML = (t) => '<div class="note">' + t + '</div>';
  function rowHTML(o) {

  function occSub(e) {
    const f = e.f, t = now(), parts = [];

      case 'due':
        parts.push(e.o.week ? '<span class="due">' + e.approved + ' of ' + e.need + ' by Sun ' + fmtTime(f.time) + '</span>' : '<span class="due">Due ' + fmtTime(f.time) + '</span>');

  // ================= Today =================
  function todayItems() {
    const t = todayKey(), items = [];
    S.forfeits.forEach((f) => {
      if (f.method === 'friend' && !f.verifier) {
        if (f.repeat === 'once' && f.date < t) return;
        items.push({ order: 3, dl: 0, html: rowHTML({ act: 'open-f', id: f.id, status: 'upcoming', title: f.title, sub: '<span class="due">Waiting for ' + esc(verifierName(f)) + ' to join</span>', amount: f.amount }) });
        return;
      }
      const e = currentOcc(f);
      if (!e || e.o.week || e.key !== t) return;
      items.push({ order: ORDER[e.status], dl: e.deadline, html: rowHTML({ act: 'open-f', id: f.id, status: e.status, title: f.title, sub: occSub(e), amount: f.amount, hot: e.status === 'failed' }) });
    });
    S.duels.forEach((d) => {
      const s = myDuelDay(d, t);
      if (!s || s === 'up') return;
      const status = s === 'done' ? 'done' : s === 'miss' ? 'failed' : 'due';
      const others = d.players.filter((p) => p !== S.meId).map(nameOf);
      const sub = (s === 'done' ? '<span class="good">Checked in</span>' : s === 'miss' ? '<span class="bad">Missed</span>' : '<span class="due">Due ' + fmtTime(d.time) + '</span><span>' + left(deadlineOf(t, d.time) - now()) + ' left</span>') +
        '<span>vs ' + esc(others.join(', ') || 'friends') + '</span>';
      items.push({ order: ORDER[status], dl: deadlineOf(t, d.time), html: rowHTML({ act: 'open-d', id: d.id, status, title: d.title, sub, amount: d.amount, hot: status === 'failed' }) });
    });
    return items.sort((a, b) => a.order - b.order || a.dl - b.dl);
  }
  function weeklyItems() {
    return S.forfeits.map((f) => ({ f, e: currentOcc(f) })).filter((x) => x.e && x.e.o.week)
      .map((x) => rowHTML({ act: 'open-f', id: x.f.id, status: x.e.status, title: x.f.title, sub: occSub(x.e), amount: x.f.amount, hot: x.e.status === 'failed' }));
  }
  function comingItems() {
    const t = todayKey(), items = [];
    S.forfeits.forEach((f) => {
      const e = currentOcc(f);
      if (!e || e.o.week || e.key === t || e.status !== 'upcoming') return;
      items.push({ dl: e.deadline, html: rowHTML({ act: 'open-f', id: f.id, status: 'upcoming', title: f.title, sub: occSub(e), amount: f.amount }) });
    });
    S.duels.forEach((d) => {
      const r = duelState(d).cur;
      if (r.status !== 'soon' && r.status !== 'waiting') return;
      const sub = r.status === 'waiting' ? '<span class="due">Waiting for friends to join</span>' : '<span>Starts ' + esc(rel(r.day1).replace(/^on /, '')) + '</span>';
      items.push({ dl: deadlineOf(r.day1, d.time), html: rowHTML({ act: 'open-d', id: d.id, status: 'upcoming', title: d.title, sub, amount: d.amount }) });
    });
    return items.sort((a, b) => a.dl - b.dl).slice(0, 8).map((x) => x.html);
  }
  function occDeadline(f, occ) { return occ.charAt(0) === 'w' ? deadlineOf(addDays(occ.slice(1), 6), f.time) : deadlineOf(occ, f.time); }
  function reviewItems() {
    const t = now();
    return S.toVerify.filter((c) => c.kind === 'proof' && c.status === 'pending').map((c) => {
      const f = S.verifying.find((x) => x.id === c.fid);
      if (!f) return null;
      const dl = occDeadline(f, c.occ);
      if (t > dl + FRIEND_GRACE || c.at > dl) return null;
      return { c, f, dl };
    }).filter(Boolean);
  }
  function dayStats(k) {
    const t = todayKey();
    let total = 0, done = 0, wait = 0, miss = 0;
    S.forfeits.forEach((f) => {
      if (f.repeat === 'weekly') return;
      occsOf(f, k, k).forEach((o) => {
        const e = evalOcc(f, o);
        total++;
        if (e.status === 'done' || e.status === 'skipped') done++;
        else if (e.status === 'failed' || e.status === 'settled') miss++;
        else if (k <= t && (e.status === 'due' || e.status === 'pending')) wait++;
      });
    });
    S.duels.forEach((d) => {
      const s = myDuelDay(d, k);
      if (!s) return;
      total++;
      if (s === 'done') done++; else if (s === 'miss') miss++; else if (s === 'wait' && k <= t) wait++;
    });
    return { total, done, wait, miss };
  }
  function summaryHTML() {
    const t = todayKey(), mon = addDays(mondayOf(t), 7 * S.weekOffset), ts = dayStats(t);
    let strip = '';
    for (let i = 0; i < 7; i++) {

    return '<section class="card summary"><div class="sum-row"><div><div class="big-count">' + ts.done + '<span>/' + ts.total + '</span></div>' +

  // ================= Duels tab =================

  async function findCode(btn) {
    const root = sheetRoot();
    if (!root) return;
    const raw = $('#cd-code', root).value.trim(), err = $('#cd-err', root), out = $('#cd-found', root);
    err.textContent = ''; out.innerHTML = '';
    const sm = /fgs1\.([A-Za-z0-9_-]{10,})/.exec(raw);
    if (sm && S.sync) {
      let cfg = null;
      try { cfg = JSON.parse(unb64u(sm[1])); } catch (e) { cfg = null; }
      if (!validServer(cfg)) { err.textContent = 'That setup code looks broken. Ask your friend to send it again.'; return; }
      const cur = S.settings.server;
      if (!cur || cur.u !== cfg.u || cur.k !== cfg.k) {
        S.sheet.pendingCfg = cfg;
        out.innerHTML = '<div class="verdict wait"><span class="st st-wait">' + ic('share') + '</span><span><b>Join your friend\u2019s sync?</b><span>Their invite uses a shared database at ' + esc(host(cfg.u)) + '. Anything already on this phone moves there too.</span></span></div><button class="btn primary wide" data-act="connect-invite">Connect and continue</button>';
        return;
      }
    }
    const up = raw.toUpperCase();
    const cm = /CODE[:=]\s*([A-Z0-9]{6})\b/.exec(up) || /^\s*([A-Z0-9]{6})\s*$/.exec(up);
    if (!cm) { err.textContent = 'Codes are 6 letters and numbers.'; return; }
    if (!S.shared) { err.textContent = S.sync ? 'Codes need sync. Set it up in the You tab first.' : 'Codes need Claude sign-in.'; return; }
    await busy(btn, 'Finding\u2026', async () => {
      const ds = await S.store.getWhere('duels', 'code', cm[1]);
      if (ds.length) { showDuelInvite(normDuel(ds[0])); return; }
      const fs = await S.store.getWhere('forfeits', 'code', cm[1]);

  }
  const nickField = () => (myName() ? '' : '<label class="field"><span class="lab">Your name</span><input class="input" id="cd-nick" maxlength="30" value="' + esc(firstWord(S.profileName)) + '" autocomplete="given-name"><small class="hint">So your friends know it\u2019s you.</small></label>');
  function showDuelInvite(d) {

  async function joinDuel(btn) {
    const root = sheetRoot(), d0 = S.sheet && S.sheet.found;
    if (!root || !d0) return;
    const err = $('#cd-err', root);
    await busy(btn, 'Joining\u2026', async () => {
      if (!(await saveNickFromSheet(root))) return;
      const st = S.store;
      if (!(await st.claim('duels', d0.id, S.meId))) { err.textContent = 'Someone else is joining right now. Try again in a few seconds.'; return; }
      const raw = await st.get('duels', d0.id);
      if (!raw) { err.textContent = 'This duel was deleted.'; return; }
      const d = normDuel(raw);
      if (d.players.indexOf(S.meId) < 0) {
        if (d.players.length >= MAX_PLAYERS) { err.textContent = 'This duel is full.'; return; }
        const last = d.rounds[d.rounds.length - 1], dl = deadlineOf(firstDuelDay(d, last.start), d.time);
        const patch = { players: d.players.concat([S.meId]) };
        if (now() >= dl) {
          if (d.players.length >= 2) { err.textContent = 'This duel already started.'; return; }
          patch.rounds = d.rounds.concat([{ start: addDays(todayKey(), 1) }]);
        }
        await st.update('duels', d.id, patch);
      }
      closeSheet();
      S.tab = 'duels';
      push({ type: 'duel', id: d.id, key: 'duel:' + d.id, since: Date.now() });
      toast('You\u2019re in. First to miss donates.');
      haptic('success');
    });
  }
  async function acceptVerify(btn) {

    await busy(btn, 'Joining\u2026', async () => {
      if (!(await saveNickFromSheet(root))) return;
      const st = S.store;
      if (!(await st.claim('forfeits', f0.id, S.meId))) { err.textContent = 'Try again in a few seconds.'; return; }
      const raw = await st.get('forfeits', f0.id);

  async function copyText(t) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); return true; } } catch (e) { /* fall back */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }

    }
    if (await copyText(text)) toast(copiedMsg || 'Copied. Paste it in a text.');

  function serverError(e) {
    if (e && e.code === 'auth') return 'That key didn\u2019t work. Copy the anon or publishable key again.';
    if (e && (e.status === 404 || /forgood_docs|PGRST205|does not exist/i.test(e.message || ''))) return 'Connected, but the forgood_docs table is missing. Run the setup SQL first.';
    if (e && e.code === 'unavailable') return 'Couldn\u2019t reach that URL. Check it and your connection.';

  async function connectServer(cfg) {
    const srv = makeServerStore(cfg);
    await srv.ping();
    if (S.mode === 'local' && S.store.dump) {
      const dump = S.store.dump();
      for (let i = 0; i < COLLS.length; i++) {
        const c = COLLS[i], ids = Object.keys(dump[c]);
        for (let j = 0; j < ids.length; j++) await srv.set(c, ids[j], dump[c][ids[j]]);
      }
    }
    S.settings.server = { u: cfg.u, k: cfg.k };
    saveSettings();
    teardown();
    S.mode = 'server'; S.store = srv; S.shared = true; S.offline = false; S.imgs = {}; S.pages = [];
    subscribeAll();
    if (myName()) await srv.set('members', S.meId, { nick: myName() });

    if (c === 'quota_exceeded') return 'Storage is full. Remove some old photos or forfeits and try again.';
    if (c === 'resource_exhausted') return 'Too many changes at once. Wait a few seconds and try again.';
    if (c === 'revoked') return 'Your access to this page changed. Reload to keep going.';

    return 'Couldn\u2019t reach the server. Check your connection and try again.';
  }
  let lastErr = 0;

    if (e && e.code === 'revoked') { S.revoked = true; render(); return; }
    if (S.mode === 'server' && e && e.code === 'unavailable') { if (!S.offline) { S.offline = true; render(); } return; }
    if (Date.now() - lastErr > 15000) { lastErr = Date.now(); toast(errMsg(e)); }

  async function busy(btn, label, fn) {

      console.error(e);
      toast(errMsg(e));
      if (e && e.code === 'invalid_argument' && S.mode === 'claude' && S.canWrite !== true) { S.readOnly = true; render(); }
    } finally {

    }
  }

  // ================= reminders (app only) =================
  let remTimer = 0;
  function scheduleReminders() {
    if (!S.native) return;
    clearTimeout(remTimer);
    remTimer = setTimeout(() => {
      const t = now(), tk = todayKey(), items = [];
      S.forfeits.forEach((f) => {
        occsOf(f, tk, addDays(tk, 2)).forEach((o) => {
          const e = evalOcc(f, o);
          if (e.status !== 'due' && e.status !== 'upcoming') return;
          const at = e.deadline - 3600e3;
          if (at > t + 60000) items.push({ id: 'f-' + f.id + '-' + o.key, title: f.title, body: '1 hour left. Miss it and ' + money(f.amount) + ' goes to ' + f.charity.name + '.', at });
        });
      });
      S.duels.forEach((d) => {
        for (let i = 0; i < 3; i++) {
          const k = addDays(tk, i), s = myDuelDay(d, k);
          if (s !== 'wait' && s !== 'up') continue;
          const at = deadlineOf(k, d.time) - 3600e3;
          if (at > t + 60000) items.push({ id: 'd-' + d.id + '-' + k, title: d.title + ' (duel)', body: '1 hour left to check in. First to miss donates ' + money(d.amount) + '.', at });
        }
      });
      items.sort((a, b) => a.at - b.at);
      const list = items.slice(0, 48), sig = JSON.stringify(list);
      if (sig !== S.lastRem) { S.lastRem = sig; nativePost({ type: 'reminders', items: list }); }
    }, 1200);
  }

  // ================= data wiring =================
  function changed() { S.ver++; render(); scheduleReminders(); }

    S.settings = loadSettings();
    render();
    let db = null, user = null, sample = null;
    const c = window.claude;
    if (!S.native && c && typeof c.use === 'function') {
      try {
        const got = await Promise.all([c.use('db'), c.use('user'), c.use('sample')]);
        db = got[0]; user = got[1]; sample = got[2];
      } catch (e) { db = null; }
    }
    if (db) {
      S.mode = 'claude'; S.store = makeClaudeStore(db); S.user = user || null;
      let me = null;
      if (user) { try { me = await user.me(); } catch (e) { me = null; } }
      S.profileName = (me && me.name) || '';
      S.meId = (me && me.id) || deviceId();
      if (user) { try { S.canWrite = await user.can('data.write'); } catch (e) { S.canWrite = null; } }
      S.readOnly = S.canWrite === false;
      if (sample) { try { const lim = await sample.limits(); if (lim && lim.images) S.sample = sample; } catch (e) { S.sample = null; } }
    } else if (S.sync && validServer(S.settings.server)) {
      S.mode = 'server'; S.store = makeServerStore(S.settings.server); S.meId = deviceId();
    } else {
      S.mode = 'local'; S.store = makeLocalStore(); S.meId = deviceId();
    }
    S.shared = S.mode !== 'local';
    S.phase = 'ready';
    subscribeAll();
    render();
    if (!S.shared) setTimeout(maybeWelcome, 250);
    setInterval(() => { S.ver++; render(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { S.ver++; render(); scheduleReminders(); } });
    if (S.native) {
      window.__fgOpenURL = (u) => { if (S.phase === 'ready') openCode(String(u || '')); };
      if (S.native.pendingURL) setTimeout(() => window.__fgOpenURL(S.native.pendingURL), 600);
      if (location.hash) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } }
    }
  }
  boot();
})();

</script>
